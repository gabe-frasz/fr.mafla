// Customizações do Mafla, mantidas fora do build.gradle do upstream para
// reduzir conflitos nos merges. Aplicado por `apply from: 'mafla.gradle'`.
android {
    flavorDimensions = ["brand"]
    productFlavors {
        mafla {
            dimension "brand"
            applicationId "fr.mafla"
        }
    }
}
